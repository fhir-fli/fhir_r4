name: fhir_r4_db
description: FHIR R4B database on SQLite/Drift, the fhir_db store bound to fhir_r4, with search parameter indexing, history, compartments and optional encryption.
version: 0.12.0
homepage: https://www.fhirfli.dev/
repository: https://github.com/fhir-fli/fhir_r4
issue_tracker: https://github.com/fhir-fli/fhir_r4/issues

topics:
  - fhir
  - hl7
  - healthcare
  - database
  - sqlite

# This package supports all platforms listed below.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.5.0

# The store itself is fhir_db, model-independent; this package binds it to
# fhir_r4 and carries the generated per-version data.
dependencies:
  drift: ^2.33.0
  fhir_db: ^0.13.0
  fhir_node: ^0.6.0
  fhir_r4: ^0.12.0

dev_dependencies:
  collection: ^1.19.1
  test: ^1.29.0
  very_good_analysis: ^10.0.0

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

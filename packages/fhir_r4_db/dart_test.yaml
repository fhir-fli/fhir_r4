# The two-process zone test (date_zone_independence_test.dart) starts a
# second `dart run` for a store in another time zone. On GitHub's runner
# that child never finishes (15 minutes, twice, 2026-09-18) while it takes
# 25 s here; the parent `dart test` holding the native build-hook lock the
# child waits on is the likely cause, unmeasured. Skipped by default; run it
# with `dart test --run-skipped -t zone`.
tags:
  zone:
    skip: "starts a second dart process; run with --run-skipped -t zone"

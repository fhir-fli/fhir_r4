name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Point every package at its siblings in THIS checkout.
      #
      # Without this each package resolves its siblings from pub.dev, so a
      # change to fhir_r4_path is not exercised by the fhir_r4_mapping tests
      # until after it is published. That is exactly how 0.8.0 shipped a
      # regression: the mapping suite was testing the released 0.7.0 binding,
      # not the modified one sitting in the same commit.
      #
      # pubspec_overrides.yaml is gitignored, so these are build-time only.
      - name: Resolve sibling packages from this checkout
        run: |
          set -e
          for d in packages/*/; do
            [ -f "${d}pubspec.yaml" ] || continue
            self=$(basename "$d")
            {
              echo "# Generated by CI: test siblings as they are in this commit,"
              echo "# not as they are on pub.dev."
              echo "dependency_overrides:"
              for s in packages/*/; do
                [ -f "${s}pubspec.yaml" ] || continue
                name=$(basename "$s")
                [ "$name" = "$self" ] && continue
                case "$name" in fhir_r[456]|fhir_r[456]_*) ;; *) continue ;; esac
                echo "  ${name}:"
                echo "    path: ${GITHUB_WORKSPACE}/packages/${name}"
              done
            } > "${d}pubspec_overrides.yaml"
          done
          echo "Overrides written for $(ls -d packages/*/ | wc -l) packages"

      # Every package is checked even if an earlier one fails. Previously the
      # loop ran under `set -e`, so the first failing package aborted the job
      # and hid every package after it alphabetically — the 0.8.0 regression
      # failed in fhir_r4_mapping, which sorts before fhir_r4_path, so the
      # tests that mattered never ran.
      - name: Analyze, format & test each package
        run: |
          failed=""
          for d in packages/*/; do
            [ -f "${d}pubspec.yaml" ] || continue
            pkg=$(basename "$d")
            echo "::group::$pkg"
            (
              set -e
              cd "$d"
              flutter pub get
              # Scope to the package's own dirs: nested demo apps are separate
              # packages whose formatter context (language version) differs.
              for f in lib test example bin tool; do
                if [ -d "$f" ]; then
                  dart format --output=none --set-exit-if-changed "$f"
                fi
              done
              flutter analyze
              if [ -d test ]; then flutter test; fi
            )
            if [ $? -ne 0 ]; then
              failed="${failed} ${pkg}"
              echo "::error::${pkg} failed"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Failing packages:${failed}"
            exit 1
          fi
          echo "All packages passed"
